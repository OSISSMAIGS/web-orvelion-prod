<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FF6B00" />
  <meta name="description" content="{{ site.description }}" />
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/orvelion.jpg') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orvelion: {
              coral: "#FF6B00",
              rust: "#CC4400",
              peach: "#E5E5E5",
              ember: "#B33800",
              apricot: "#FF8533",
              amber: "#FF7A00",
              lilac: "#FFFFFF",
              blush: "#FFFFFF",
              rose: "#E5E5E5",
              dark: "#0a0a0a",
              surface: "#121212",
              card: "#181818",
              orange: "#FF6B00",
              darkorange: "#CC4400",
              black: "#000000",
              white: "#FFFFFF",
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="min-h-screen flex flex-col bg-orvelion-dark text-white selection:bg-orvelion-coral selection:text-black">
  {% include "partials/icons.html" %}
  {% if show_chrome %}
    {% include "partials/navbar.html" %}
  {% endif %}
  <main class="flex-1 {% if show_chrome %}pt-20{% endif %}">
    {% block content %}{% endblock %}
  </main>
  {% if show_chrome %}
    {% include "partials/footer.html" %}
  {% endif %}
  <script src="{{ url_for('static', filename='js/app.js') }}?v=2.8"></script>
</body>
</html>
